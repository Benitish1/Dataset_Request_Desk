services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: desk
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desk"]
      interval: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:12345@db:5432/desk
      JWT_SECRET: change-me-in-real-deployments
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
